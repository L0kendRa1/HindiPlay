<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Pigeon (कबूतर) -->
    <!-- Body -->
    <ellipse cx="52" cy="56" rx="24" ry="26" fill="#94a3b8" />
    <!-- Head -->
    <circle cx="42" cy="34" r="14" fill="#64748b" />
    <!-- Iridescent Neck Patch -->
    <path d="M 38 40 Q 48 48 56 42" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
    <!-- Beak -->
    <polygon points="34,33 22,36 34,39" fill="#f43f5e" />
    <!-- Eye -->
    <circle cx="40" cy="32" r="3.5" fill="#ea580c" />
    <circle cx="40" cy="32" r="1.8" fill="#0f172a" />
    <!-- Wing with Dark Bars -->
    <path d="M 50 48 C 66 52 74 68 64 80 C 52 74 46 62 50 48 Z" fill="#475569" />
    <line x1="56" y1="62" x2="68" y2="68" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
    <line x1="54" y1="69" x2="66" y2="75" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  </svg>