<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Cheetah (चीता) -->
    <!-- Ears -->
    <circle cx="28" cy="26" r="11" fill="#ea580c" />
    <circle cx="28" cy="26" r="6" fill="#fef08a" />
    <circle cx="72" cy="26" r="11" fill="#ea580c" />
    <circle cx="72" cy="26" r="6" fill="#fef08a" />
    <!-- Face -->
    <ellipse cx="50" cy="55" rx="34" ry="30" fill="#f59e0b" />
    <!-- Spots -->
    <circle cx="30" cy="40" r="3" fill="#1e293b" />
    <circle cx="70" cy="40" r="3" fill="#1e293b" />
    <circle cx="50" cy="34" r="2.5" fill="#1e293b" />
    <circle cx="25" cy="58" r="3" fill="#1e293b" />
    <circle cx="75" cy="58" r="3" fill="#1e293b" />
    <!-- Tear Marks (characteristic of cheetah) -->
    <path d="M 40 50 Q 42 64 45 68" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 60 50 Q 58 64 55 68" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Eyes -->
    <ellipse cx="40" cy="48" rx="5" ry="4" fill="#0f172a" />
    <ellipse cx="60" cy="48" rx="5" ry="4" fill="#0f172a" />
    <circle cx="38.5" cy="46.5" r="1.5" fill="#ffffff" />
    <circle cx="58.5" cy="46.5" r="1.5" fill="#ffffff" />
    <!-- Nose & Muzzle -->
    <ellipse cx="50" cy="68" rx="12" ry="8" fill="#fef3c7" />
    <polygon points="50,65 46,61 54,61" fill="#1e293b" />
    <path d="M 46 68 Q 50 72 54 68" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />
  </svg>