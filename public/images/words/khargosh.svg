<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Rabbit (खरगोश) -->
    <!-- Ears -->
    <ellipse cx="38" cy="22" rx="7" ry="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <ellipse cx="38" cy="22" rx="4" ry="14" fill="#fbcfe8" />
    <ellipse cx="62" cy="22" rx="7" ry="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <ellipse cx="62" cy="22" rx="4" ry="14" fill="#fbcfe8" />
    <!-- Head -->
    <circle cx="50" cy="48" r="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <!-- Body -->
    <ellipse cx="50" cy="76" rx="25" ry="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <!-- Eyes -->
    <circle cx="42" cy="44" r="3.5" fill="#1e293b" />
    <circle cx="58" cy="44" r="3.5" fill="#1e293b" />
    <!-- Nose & Mouth -->
    <polygon points="50,52 46,48 54,48" fill="#f472b6" />
    <path d="M 46 54 Q 50 58 54 54" stroke="#94a3b8" stroke-width="2" fill="none" />
    <!-- Cheeks -->
    <circle cx="36" cy="50" r="4" fill="#fbcfe8" opacity="0.6" />
    <circle cx="64" cy="50" r="4" fill="#fbcfe8" opacity="0.6" />
  </svg>