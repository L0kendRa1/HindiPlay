<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Bicycle (साइकिल) -->
    <!-- Two Wheels -->
    <circle cx="24" cy="64" r="18" fill="none" stroke="#1e293b" stroke-width="4" />
    <circle cx="24" cy="64" r="3" fill="#64748b" />
    <circle cx="76" cy="64" r="18" fill="none" stroke="#1e293b" stroke-width="4" />
    <circle cx="76" cy="64" r="3" fill="#64748b" />
    <!-- Spokes -->
    <line x1="24" y1="46" x2="24" y2="82" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="6" y1="64" x2="42" y2="64" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="76" y1="46" x2="76" y2="82" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="58" y1="64" x2="94" y2="64" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Frame -->
    <polygon points="24,64 48,64 68,44 44,44" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" fill="none" />
    <line x1="48" y1="64" x2="40" y2="36" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />
    <line x1="76" y1="64" x2="68" y2="34" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />
    <!-- Handlebars & Seat -->
    <path d="M 64 34 L 72 34 L 74 38" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none" />
    <ellipse cx="38" cy="34" rx="7" ry="2.5" fill="#0f172a" />
  </svg>