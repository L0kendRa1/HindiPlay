<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Goat (बकरी) -->
    <!-- Horns -->
    <path d="M 38 28 Q 28 12 36 8" stroke="#78350f" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 62 28 Q 72 12 64 8" stroke="#78350f" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Drooping Ears -->
    <ellipse cx="22" cy="42" rx="7" ry="15" transform="rotate(25 22 42)" fill="#fed7aa" stroke="#fdba74" stroke-width="1.5" />
    <ellipse cx="78" cy="42" rx="7" ry="15" transform="rotate(-25 78 42)" fill="#fed7aa" stroke="#fdba74" stroke-width="1.5" />
    <!-- Head -->
    <polygon points="34,30 66,30 58,70 42,70" fill="#ffedd5" stroke="#fed7aa" stroke-width="2" />
    <!-- Beard -->
    <polygon points="46,70 54,70 50,84" fill="#fed7aa" />
    <!-- Eyes -->
    <ellipse cx="40" cy="44" rx="4" ry="3" fill="#1e293b" />
    <ellipse cx="60" cy="44" rx="4" ry="3" fill="#1e293b" />
    <circle cx="39" cy="43" r="1.2" fill="#ffffff" />
    <circle cx="59" cy="43" r="1.2" fill="#ffffff" />
    <!-- Nose & Mouth -->
    <polygon points="50,60 46,56 54,56" fill="#ea580c" />
    <path d="M 47 64 Q 50 67 53 64" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none" />
  </svg>