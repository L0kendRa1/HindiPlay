    <!-- Body -->
    <path d="M 22 65 C 22 50 48 48 70 58 C 82 64 85 78 70 82 C 45 86 22 85 22 65 Z" fill="#facc15" />
    <!-- Head & Neck -->
    <circle cx="34" cy="40" r="14" fill="#facc15" />
    <path d="M 34 50 L 38 65 L 26 65 Z" fill="#facc15" />
    <!-- Eye -->
    <circle cx="30" cy="38" r="2.5" fill="#1e293b" />
    <!-- Beak -->
    <polygon points="20,40 10,44 22,46" fill="#f97316" />
    <!-- Wing -->
    <ellipse cx="55" cy="68" rx="12" ry="7" fill="#eab308" />
  </svg>