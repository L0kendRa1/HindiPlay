<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Wise Scholar / Sage (ज्ञानी) -->
    <!-- Aura / Halo -->
    <circle cx="50" cy="46" r="38" fill="#fef08a" opacity="0.4" />
    <!-- Turban / Crown -->
    <ellipse cx="50" cy="26" rx="22" ry="12" fill="#f97316" />
    <circle cx="50" cy="22" r="5" fill="#f59e0b" />
    <!-- Head -->
    <circle cx="50" cy="46" r="22" fill="#fed7aa" />
    <!-- Tilak -->
    <line x1="50" y1="34" x2="50" y2="42" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="50" cy="43" r="1.5" fill="#facc15" />
    <!-- Eyes -->
    <circle cx="42" cy="46" r="2.5" fill="#1e293b" />
    <circle cx="58" cy="46" r="2.5" fill="#1e293b" />
    <!-- Gentle Smile -->
    <path d="M 45 54 Q 50 58 55 54" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- White Beard -->
    <path d="M 38 52 C 38 72 62 72 62 52 Z" fill="#f8fafc" />
    <!-- Open Sacred Book in hands -->
    <polygon points="50,70 32,66 32,86 50,88" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    <polygon points="50,70 68,66 68,86 50,88" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  </svg>