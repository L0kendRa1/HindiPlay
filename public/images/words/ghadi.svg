<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Clock (घड़ी) -->
    <!-- Bells & Legs -->
    <circle cx="28" cy="22" r="10" fill="#f59e0b" />
    <circle cx="72" cy="22" r="10" fill="#f59e0b" />
    <rect x="30" y="80" width="6" height="12" rx="2" fill="#b45309" transform="rotate(20 30 80)" />
    <rect x="64" y="80" width="6" height="12" rx="2" fill="#b45309" transform="rotate(-20 64 80)" />
    <!-- Clock Face -->
    <circle cx="50" cy="52" r="34" fill="#fef3c7" stroke="#d97706" stroke-width="6" />
    <circle cx="50" cy="52" r="28" fill="#ffffff" />
    <!-- Hands (3 o'clock) -->
    <line x1="50" y1="52" x2="50" y2="34" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    <line x1="50" y1="52" x2="66" y2="52" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <circle cx="50" cy="52" r="3" fill="#1e293b" />
  </svg>