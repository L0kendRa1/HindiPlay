<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Owl (उल्लू) -->
    <!-- Body -->
    <ellipse cx="50" cy="58" rx="30" ry="34" fill="#92400e" />
    <!-- Belly -->
    <ellipse cx="50" cy="62" rx="20" ry="24" fill="#fed7aa" />
    <!-- Ears -->
    <polygon points="26,30 38,15 42,32" fill="#78350f" />
    <polygon points="74,30 62,15 58,32" fill="#78350f" />
    <!-- Eyes Background -->
    <circle cx="38" cy="42" r="14" fill="#ffffff" stroke="#78350f" stroke-width="3" />
    <circle cx="62" cy="42" r="14" fill="#ffffff" stroke="#78350f" stroke-width="3" />
    <!-- Eyeballs -->
    <circle cx="38" cy="42" r="7" fill="#1e293b" />
    <circle cx="62" cy="42" r="7" fill="#1e293b" />
    <circle cx="36" cy="40" r="2.5" fill="#ffffff" />
    <circle cx="60" cy="40" r="2.5" fill="#ffffff" />
    <!-- Beak -->
    <polygon points="50,48 46,56 54,56" fill="#f59e0b" />
    <!-- Feet -->
    <ellipse cx="40" cy="92" rx="6" ry="3" fill="#f59e0b" />
    <ellipse cx="60" cy="92" rx="6" ry="3" fill="#f59e0b" />
  </svg>