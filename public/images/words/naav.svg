<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Boat (नाव) -->
    <!-- Water Waves -->
    <path d="M 4 80 Q 20 74 36 80 T 68 80 T 100 80" stroke="#0284c7" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Boat Hull -->
    <polygon points="16,62 84,62 74,76 26,76" fill="#b45309" stroke="#78350f" stroke-width="2" />
    <!-- Mast -->
    <line x1="50" y1="16" x2="50" y2="62" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
    <!-- Big Sail -->
    <polygon points="52,18 78,54 52,54" fill="#38bdf8" />
    <polygon points="48,24 24,54 48,54" fill="#f43f5e" />
    <!-- Flag on top -->
    <polygon points="50,16 60,20 50,24" fill="#fbbf24" />
  </svg>