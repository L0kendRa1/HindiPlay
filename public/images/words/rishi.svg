<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Sage / Rishi (ऋषि) -->
    <!-- Aura -->
    <circle cx="50" cy="45" r="36" fill="#fef08a" opacity="0.6" />
    <!-- Torso (Robe) -->
    <path d="M 28 85 Q 50 60 72 85 Z" fill="#ea580c" />
    <!-- Head -->
    <circle cx="50" cy="42" r="16" fill="#fed7aa" />
    <!-- Hair Bun (Jata) -->
    <circle cx="50" cy="22" r="10" fill="#78350f" />
    <!-- Beard -->
    <path d="M 36 46 Q 50 75 64 46 Q 50 56 36 46 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Tilak -->
    <line x1="50" y1="32" x2="50" y2="38" stroke="#dc2626" stroke-width="2" stroke-linecap="round" />
    <!-- Calm Eyes -->
    <path d="M 42 40 Q 45 43 48 40" stroke="#475569" stroke-width="2" fill="none" />
    <path d="M 52 40 Q 55 43 58 40" stroke="#475569" stroke-width="2" fill="none" />
  </svg>