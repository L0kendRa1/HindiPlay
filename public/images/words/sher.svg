    <path d="M 44 58 Q 50 64 56 58" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Cheeks & Whiskers -->
    <circle cx="30" cy="56" r="3" fill="#f87171" opacity="0.4" />
    <circle cx="70" cy="56" r="3" fill="#f87171" opacity="0.4" />
    <line x1="22" y1="52" x2="35" y2="53" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
    <line x1="22" y1="57" x2="35" y2="56" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
    <line x1="78" y1="52" x2="65" y2="53" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
    <line x1="78" y1="57" x2="65" y2="56" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
  </svg>