<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Lion (शेर) -->
    <!-- Mane -->
    <circle cx="50" cy="50" r="42" fill="#d97706" />
    <circle cx="50" cy="50" r="37" fill="#b45309" />
    <!-- Ears -->
    <circle cx="28" cy="24" r="10" fill="#f59e0b" />
    <circle cx="28" cy="24" r="6" fill="#fef3c7" />
    <circle cx="72" cy="24" r="10" fill="#f59e0b" />
    <circle cx="72" cy="24" r="6" fill="#fef3c7" />
    <!-- Face -->
    <circle cx="50" cy="53" r="28" fill="#fbbf24" />
    <!-- Eyes -->
    <circle cx="39" cy="48" r="4.5" fill="#1e293b" />
    <circle cx="61" cy="48" r="4.5" fill="#1e293b" />
    <circle cx="37.5" cy="46.5" r="1.5" fill="#ffffff" />
    <circle cx="59.5" cy="46.5" r="1.5" fill="#ffffff" />
    <!-- Nose & Mouth -->
