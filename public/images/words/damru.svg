<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Damru (डमरू) -->
    <!-- Upper & Lower Cones -->
    <polygon points="25,20 75,20 50,50" fill="#ea580c" />
    <polygon points="25,80 75,80 50,50" fill="#ea580c" />
    <!-- Drum heads -->
    <ellipse cx="50" cy="20" rx="25" ry="6" fill="#fed7aa" stroke="#9a3412" stroke-width="2" />
    <ellipse cx="50" cy="80" rx="25" ry="6" fill="#fed7aa" stroke="#9a3412" stroke-width="2" />
    <!-- Strings / Cords -->
    <line x1="26" y1="22" x2="74" y2="78" stroke="#fef08a" stroke-width="2" />
    <line x1="74" y1="22" x2="26" y2="78" stroke="#fef08a" stroke-width="2" />
    <!-- Knotted Beads -->
    <circle cx="50" cy="50" r="5" fill="#78350f" />
    <circle cx="28" cy="50" r="4" fill="#1e293b" />
    <circle cx="72" cy="50" r="4" fill="#1e293b" />
    <line x1="28" y1="50" x2="72" y2="50" stroke="#fef08a" stroke-width="2" />
  </svg>