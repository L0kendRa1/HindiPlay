<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Trishul / Trident (त्रिशूल) -->
    <!-- Center Pole -->
    <line x1="50" y1="36" x2="50" y2="92" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
    <!-- Middle Spear Point -->
    <polygon points="50,10 44,38 56,38" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
    <!-- Left Curved Prong -->
    <path d="M 50 40 C 32 40 24 24 24 16 C 30 24 42 34 50 36" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
    <!-- Right Curved Prong -->
    <path d="M 50 40 C 68 40 76 24 76 16 C 70 24 58 34 50 36" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
    <!-- Damru Attached -->
    <polygon points="43,46 57,46 43,58 57,58" fill="#ea580c" />
    <line x1="43" y1="52" x2="57" y2="52" stroke="#fde047" stroke-width="2" />
  </svg>